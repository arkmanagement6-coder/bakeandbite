<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Bake & Bite</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .account-grid { display: grid; grid-template-columns: 280px 1fr; gap: 40px; }
        .sidebar-link { display: block; padding: 15px 20px; border-radius: 8px; margin-bottom: 5px; font-weight: 600; }
        .sidebar-link.active { background: var(--primary); color: white; }
        .order-card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid var(--glass-border); }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; color: white; }
    </style>
</head>
<body>
    <div id="header-root"></div>

    <main class="section">
        <div class="container">
            <h2 style="margin-bottom: 40px;">My Account</h2>

            <div class="account-grid">
                <aside>
                    <div class="glass-card" style="padding: 15px;">
                        <a href="#" class="sidebar-link active" data-section="orders">My Orders</a>
                        <a href="#" class="sidebar-link" data-section="profile">Profile Details</a>
                        <a href="#" class="sidebar-link" data-section="addresses">Delivery Addresses</a>
                    </div>
                </aside>

                <div class="content-area">
                    <div id="orders-section" class="account-section">
                        <h3 style="margin-bottom: 25px;">Order History</h3>
                        <div id="orders-list">
                            <!-- Orders injected here -->
                        </div>
                    </div>

                    <div id="profile-section" class="account-section" style="display: none;">
                        <h3 style="margin-bottom: 25px;">Profile Details</h3>
                        <div class="glass-card" style="padding: 30px;">
                            <form id="profile-form">
                                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                                    <div>
                                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Full Name</label>
                                        <input type="text" id="profile-name" class="form-input" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); outline: none;">
                                    </div>
                                    <div>
                                        <label style="display: block; margin-bottom: 8px; font-weight: 600;">Email Address</label>
                                        <input type="email" id="profile-email" class="form-input" disabled style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: #f9f9f9; cursor: not-allowed;">
                                    </div>
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 600;">Phone Number</label>
                                    <input type="tel" id="profile-phone" class="form-input" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); outline: none;">
                                </div>
                                <button type="submit" class="btn btn-primary">Update Profile</button>
                            </form>
                        </div>
                    </div>

                    <div id="addresses-section" class="account-section" style="display: none;">
                        <div class="flex justify-between align-center" style="margin-bottom: 25px;">
                            <h3>Delivery Addresses</h3>
                            <button class="btn btn-accent" style="padding: 8px 20px; font-size: 0.9rem;">Add New Address</button>
                        </div>
                        <div id="addresses-list">
                            <!-- Addresses injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-root"></div>

    <script type="module">
        import Store from './js/store.js';
        import { renderHeader, renderFooter } from './js/components/common.js';

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('header-root').appendChild(renderHeader());
            document.getElementById('footer-root').appendChild(renderFooter());

            // Check if logged in
            const user = Store.getCurrentUser();
            if (!user) {
                // For demo purposes, if no user, set a dummy user
                Store.setCurrentUser({
                    name: 'Ravi Singh Dhakre',
                    email: 'ravi.dhakre@example.com',
                    phone: '+91 9875194320',
                    addresses: [
                        { id: 1, type: 'Home', address: '25/172 line no 11 12 patel nagar jeoni mandi agra 282004', isDefault: true }
                    ]
                });
            }

            renderUserOrders();
            renderProfile();
            renderAddresses();
            setupNavigation();
        });

        function setupNavigation() {
            const links = document.querySelectorAll('.sidebar-link');
            const sections = document.querySelectorAll('.account-section');

            links.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const sectionId = link.getAttribute('data-section');

                    // Update links
                    links.forEach(l => l.classList.remove('active'));
                    link.classList.add('active');

                    // Update sections
                    sections.forEach(s => s.style.display = 'none');
                    document.getElementById(`${sectionId}-section`).style.display = 'block';
                });
            });
        }

        function renderProfile() {
            const user = Store.getCurrentUser();
            if (!user) return;

            document.getElementById('profile-name').value = user.name || '';
            document.getElementById('profile-email').value = user.email || '';
            document.getElementById('profile-phone').value = user.phone || '';

            document.getElementById('profile-form').onsubmit = (e) => {
                e.preventDefault();
                const updatedUser = {
                    ...user,
                    name: document.getElementById('profile-name').value,
                    phone: document.getElementById('profile-phone').value
                };
                Store.setCurrentUser(updatedUser);
                alert('Profile updated successfully!');
            };
        }

        function renderAddresses() {
            const user = Store.getCurrentUser();
            const list = document.getElementById('addresses-list');
            
            if (!user || !user.addresses || user.addresses.length === 0) {
                list.innerHTML = `<div class="glass-card" style="padding: 30px; text-align: center; color: var(--text-muted);">No addresses saved.</div>`;
                return;
            }

            list.innerHTML = user.addresses.map(addr => `
                <div class="glass-card" style="padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <div class="flex align-center" style="gap: 10px; margin-bottom: 5px;">
                            <span style="font-weight: 700; font-family: var(--font-sans);">${addr.type}</span>
                            ${addr.isDefault ? '<span style="font-size: 0.7rem; background: #E8F5E9; color: #2E7D32; padding: 2px 8px; border-radius: 4px; font-weight: 600;">DEFAULT</span>' : ''}
                        </div>
                        <p style="font-size: 0.9rem; color: var(--text-muted); max-width: 400px;">${addr.address}</p>
                    </div>
                    <div class="flex" style="gap: 10px;">
                        <button class="btn btn-outline" style="padding: 5px 15px; font-size: 0.8rem;">Edit</button>
                        <button class="btn btn-outline" style="padding: 5px 15px; font-size: 0.8rem; color: var(--error); border-color: #ffebee;">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function renderUserOrders() {
            const orders = Store.getOrders();
            const list = document.getElementById('orders-list');

            if (orders.length === 0) {
                list.innerHTML = `
                    <div class="glass-card" style="text-align: center; padding: 60px;">
                        <p style="color: var(--text-muted); margin-bottom: 20px;">You haven't placed any orders yet.</p>
                        <a href="products.html" class="btn btn-primary">Shop Now</a>
                    </div>
                `;
                return;
            }

            list.innerHTML = orders.reverse().map(order => `
                <div class="order-card">
                    <div class="flex justify-between align-center" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee;">
                        <div>
                            <div style="font-weight: 800; color: var(--primary);">Order #${order.id}</div>
                            <div style="font-size: 0.85rem; color: var(--text-muted);">${new Date(order.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
                        </div>
                        <span class="status-badge" style="background: ${getStatusColor(order.status)}">${order.status}</span>
                    </div>
                    <div class="flex" style="gap: 40px;">
                        <div style="flex: 2;">
                            <h4 style="margin-bottom: 10px; font-family: var(--font-sans); font-size: 0.95rem;">Items</h4>
                            ${order.items.map(item => `
                                <div class="flex justify-between" style="margin-bottom: 5px; font-size: 0.9rem;">
                                    <span>${item.name} x ${item.quantity}</span>
                                    <span style="font-weight: 600;">₹${item.discountPrice * item.quantity}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div style="flex: 1; border-left: 1px solid #eee; padding-left: 40px;">
                            <h4 style="margin-bottom: 10px; font-family: var(--font-sans); font-size: 0.95rem;">Summary</h4>
                            <div class="flex justify-between" style="font-size: 0.9rem; margin-bottom: 5px;">
                                <span>Total Paid:</span>
                                <span style="font-weight: 700;">₹${order.total}</span>
                            </div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">
                                Method: ${order.paymentMethod}<br>
                                Status: ${order.paymentStatus}
                            </div>
                        </div>
                    </div>
                    <div style="margin-top: 20px; display: flex; gap: 15px;">
                        <button class="btn btn-outline" style="padding: 8px 20px; font-size: 0.85rem;">Track Order</button>
                        <button class="btn btn-outline" style="padding: 8px 20px; font-size: 0.85rem;">Download Invoice</button>
                    </div>
                </div>
            `).join('');
        }

        function getStatusColor(status) {
            switch(status) {
                case 'New Order': return '#3395FF';
                case 'Delivered': return 'var(--success)';
                case 'Cancelled': return 'var(--error)';
                case 'Preparing': return '#FF9800';
                default: return 'var(--accent)';
            }
        }
    </script>
</body>
</html>
